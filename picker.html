<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><title>Paylaşılacak ekranı seç</title><style>
body{margin:0;background:#101015;color:#e9e9f2;font:14px "Segoe UI",sans-serif;padding:16px}h3{margin:0 0 12px}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.t{background:#16161d;border:2px solid transparent;border-radius:10px;padding:8px;cursor:pointer}.t:hover{border-color:#7c5cff}
.t img{width:100%;border-radius:6px;display:block;background:#000}.t div{margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style></head>
<body><h3>Paylaşmak istediğin ekranı veya pencereyi seç</h3><div id="g"></div>
<script>const{ipcRenderer}=require('electron');ipcRenderer.on('sources',(e,l)=>{const g=document.getElementById('g');l.forEach(s=>{const d=document.createElement('div');d.className='t';const i=document.createElement('img');i.src=s.img;const n=document.createElement('div');n.textContent=s.name;d.append(i,n);d.onclick=()=>ipcRenderer.send('picked',s.id);g.appendChild(d)})});</script></body></html>
